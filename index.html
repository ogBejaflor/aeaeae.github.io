<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>æ Label Website</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="assets/css/gallery.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="assets/css/player.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Top bar with system information -->
  <div id="top-bar" role="banner">
    <span id="battery-icon" aria-label="Battery status">🔋 Loading...</span>
    <span id="volume-icon" aria-label="Volume level">🔊 50%</span>
    <span id="date-time" aria-label="Current date and time">Date & Time</span>
  </div>

  <!-- Notifications root (fixed by CSS; sits above dock/windows) -->
  <div id="ae-notify-root" aria-live="polite" aria-atomic="false" aria-relevant="additions removals"></div>

  <!-- Desktop area -->
  <div id="desktop" role="main">
    <!-- (selection box is created/managed by JS; no static div here) -->

    <!-- Desktop Folders -->
    <div class="folder window-opener" data-window="artists-window" role="button" tabindex="0" aria-label="Open Artists">
      <img src="assets/icons/folder-icon.png" alt="Artists Folder" />
      <span class="folder-label">Artists</span>
    </div>

    <div class="folder window-opener" data-window="resources-window" role="button" tabindex="0" aria-label="Open Resources">
      <img src="assets/icons/folder-icon.png" alt="Resources Folder" />
      <span class="folder-label">Resources</span>
    </div>

    <div class="folder window-opener" data-window="archive-window" role="button" tabindex="0" aria-label="Open Archive">
      <img src="assets/icons/folder-icon.png" alt="Archive Folder" />
      <span class="folder-label">Archive</span>
    </div>
  </div>

  <!-- ========================
       WINDOWS
  ========================= -->

  <!-- Artists window -->
  <div id="artists-window" class="window" style="display: none;">
    <div class="window-header">
      <div class="window-controls">
        <button class="close-button" aria-label="Close Artists window"></button>
        <button class="minimize-button" aria-label="Minimize Artists window"></button>
        <button class="fullscreen-button" aria-label="Maximize Artists window"></button>
      </div>
      <span class="window-title">Artists</span>
    </div>
    <div class="window-content">
      <!-- artist folders are added by assets/js/siteContent.js from the catalog -->
    </div>
  </div>

  <!-- Resources window -->
  <div id="resources-window" class="window" style="display: none;">
    <div class="window-header">
      <div class="window-controls">
        <button class="close-button" aria-label="Close Resources window"></button>
        <button class="minimize-button" aria-label="Minimize Resources window"></button>
        <button class="fullscreen-button" aria-label="Maximize Resources window"></button>
      </div>
      <span class="window-title">Resources</span>
    </div>
    <div class="window-content">
      <!-- Drop folders here; grid layout applies -->
    </div>
  </div>

  <!-- Archive window -->
  <div id="archive-window" class="window" style="display: none;">
    <div class="window-header">
      <div class="window-controls">
        <button class="close-button" aria-label="Close Archive window"></button>
        <button class="minimize-button" aria-label="Minimize Archive window"></button>
        <button class="fullscreen-button" aria-label="Maximize Archive window"></button>
      </div>
      <span class="window-title">Archive</span>
    </div>
    <div class="window-content">
      <!-- Drop folders here; grid layout applies -->
    </div>
  </div>

  <!-- Trash window -->
  <div id="trash-window" class="window" style="display: none;">
    <div class="window-header">
      <div class="window-controls">
        <button class="close-button" aria-label="Close Trash window"></button>
        <button class="minimize-button" aria-label="Minimize Trash window"></button>
        <button class="fullscreen-button" aria-label="Maximize Trash window"></button>
      </div>
      <span class="window-title">Trash</span>
    </div>
    <div class="window-content">
      <p>The trash is empty.</p>
    </div>
  </div>

  <!-- artist windows are added here by assets/js/siteContent.js -->

  <!-- Terminal window -->
  <div id="terminal-window" class="window" style="display:none;">
    <div class="window-header">
      <div class="window-controls">
        <button class="close-button" aria-label="Close Terminal window"></button>
        <button class="minimize-button" aria-label="Minimize Terminal window"></button>
        <button class="fullscreen-button" aria-label="Maximize Terminal window"></button>
      </div>
      <span class="window-title">Terminal</span>
    </div>

    <div class="window-content">
      <div class="terminal">
        <div class="terminal-screen" id="terminal-screen" aria-live="polite"></div>
        <div class="terminal-input-row">
          <span class="terminal-prompt" id="terminal-prompt">guest@ae:~$</span>
          <input id="terminal-input" class="terminal-input" type="text" autocomplete="off" spellcheck="false" aria-label="Terminal input" placeholder="Type a command…" />
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom dock -->
  <div id="dock-wrapper">
    <div id="dock">
      <div class="dock-item window-opener" data-window="terminal-window" role="button" tabindex="0">
        <img src="assets/icons/terminal-icon.png" alt="Terminal" />
      </div>
      <div class="dock-item window-opener" data-window="audio-player-window" role="button" tabindex="0">
        <img src="assets/icons/dock-audio.png" alt="Audio Player" />
      </div>
      <div class="dock-item window-opener" data-window="gallery-window" role="button" tabindex="0">
        <img src="assets/icons/gallery-image.jpg" alt="Gallery" />
      </div>
      <div class="dock-item window-opener" data-window="trash-window" role="button" tabindex="0">
        <img src="assets/icons/trash-icon.png" alt="Trash" />
      </div>
    </div>
  </div>

  <!-- Audio Player window -->
  <div id="audio-player-window" class="window" style="display:none;">
    <div class="window-header">
      <div class="window-controls">
        <button class="close-button" aria-label="Close Audio Player window"></button>
        <button class="minimize-button" aria-label="Minimize Audio Player window"></button>
        <button class="fullscreen-button" aria-label="Maximize Audio Player window"></button>
      </div>
      <span class="window-title">Audio Player</span>
    </div>
    <div class="window-content ae-player" id="ae-player" data-view="artists">
      <!-- top bar: where you are -->
      <header class="aep-top">
        <button class="aep-back" id="aep-back" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          <span>Artists</span>
        </button>
        <p class="aep-crumb" id="aep-crumb">æ <span class="aep-crumb-sep">/</span> Artists</p>
        <span class="aep-count" id="aep-count"></span>
      </header>

      <!-- view 1: artists on a merry-go-round, their albums small along the bottom -->
      <section class="aep-artists" id="aep-artists" aria-label="Artists">
        <div class="aep-ring-wrap" id="aep-ring-wrap">
          <div class="aep-ring" id="aep-ring" role="listbox" aria-label="Artists" tabindex="0"></div>
        </div>
        <div class="aep-artist-info">
          <h2 class="aep-artist-name" id="aep-artist-name"></h2>
          <p class="aep-artist-meta" id="aep-artist-meta"></p>
        </div>
        <div class="aep-strip" id="aep-strip" aria-label="Releases"></div>
      </section>

      <!-- view 2: the artist's albums as 3D cases (assets/js/cdCase.js draws here) -->
      <section class="aep-stage" id="aep-stage" aria-label="Albums">
        <div class="aep-caption" id="aep-caption" aria-live="polite">
          <h2 class="aep-cap-title" id="aep-cap-title"></h2>
          <p class="aep-cap-meta" id="aep-cap-meta"></p>
        </div>
        <button class="aep-arrow aep-arrow-prev" id="aep-arrow-prev" type="button" aria-label="Previous album">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="aep-arrow aep-arrow-next" id="aep-arrow-next" type="button" aria-label="Next album">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <p class="aep-hint" id="aep-hint"></p>
      </section>

      <!-- opened album: tracklist + transport slide in -->
      <aside class="aep-panel" id="aep-panel" aria-label="Tracklist" aria-hidden="true">
        <button class="aep-panel-close" id="aep-panel-close" type="button" aria-label="Close album">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <header class="aep-meta">
          <span class="aep-eyebrow" id="aep-catno"></span>
          <h2 class="aep-album" id="aep-album"></h2>
          <p class="aep-artist" id="aep-artist"></p>
          <p class="aep-stats" id="aep-stats"></p>
        </header>
        <ol class="aep-tracks" id="aep-tracks" aria-label="Tracks"></ol>
        <footer class="aep-transport">
          <div class="aep-now">
            <span class="aep-now-title" id="aep-now-title">Nothing playing</span>
            <span class="aep-now-sub" id="aep-now-sub"></span>
          </div>
          <div class="aep-timeline">
            <span class="aep-time" id="aep-t-cur">0:00</span>
            <div class="aep-bar" id="aep-progress" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="aep-bar-fill" id="aep-progress-fill"></div>
            </div>
            <span class="aep-time" id="aep-t-tot">0:00</span>
          </div>
          <div class="aep-controls">
            <button class="aep-btn" id="aep-prev" type="button" aria-label="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12M18 6.5v11a.8.8 0 0 1-1.2.7L9.2 12.7a.8.8 0 0 1 0-1.4l7.6-5.5a.8.8 0 0 1 1.2.7Z"/></svg></button>
            <button class="aep-btn aep-play" id="aep-play" type="button" aria-label="Play"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a.9.9 0 0 0 1.4.8l10-6.4a.9.9 0 0 0 0-1.6l-10-6.4A.9.9 0 0 0 8 5.6Z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg></button>
            <button class="aep-btn" id="aep-next" type="button" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6v12M6 6.5v11a.8.8 0 0 0 1.2.7l7.6-5.5a.8.8 0 0 0 0-1.4L7.2 5.8A.8.8 0 0 0 6 6.5Z"/></svg></button>
            <div class="aep-vol">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z"/><path class="w1" d="M15.5 9a4 4 0 0 1 0 6"/><path class="w2" d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
              <div class="aep-bar aep-vol-bar" id="aep-vol" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70">
                <div class="aep-bar-fill" id="aep-vol-fill"></div>
              </div>
            </div>
          </div>
        </footer>
      </aside>

      <!-- now playing, while you browse -->
      <div class="aep-mini" id="aep-mini" hidden>
        <button class="aep-mini-info" id="aep-mini-info" type="button" aria-label="Show the album that's playing">
          <span class="aep-mini-disc" id="aep-mini-disc"></span>
          <span class="aep-mini-text">
            <span class="aep-mini-title" id="aep-mini-title"></span>
            <span class="aep-mini-sub" id="aep-mini-sub"></span>
          </span>
        </button>
        <button class="aep-btn aep-mini-play" id="aep-mini-play" type="button" aria-label="Pause"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a.9.9 0 0 0 1.4.8l10-6.4a.9.9 0 0 0 0-1.6l-10-6.4A.9.9 0 0 0 8 5.6Z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg></button>
        <button class="aep-btn" id="aep-mini-next" type="button" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6v12M6 6.5v11a.8.8 0 0 0 1.2.7l7.6-5.5a.8.8 0 0 0 0-1.4L7.2 5.8A.8.8 0 0 0 6 6.5Z"/></svg></button>
        <span class="aep-mini-progress"><span id="aep-mini-fill"></span></span>
      </div>
    </div>
  </div>

  <!-- Gallery window -->
  <div id="gallery-window" class="window" style="display:none;">
    <div class="window-header">
      <div class="window-controls">
        <button class="close-button" aria-label="Close Gallery window"></button>
        <button class="minimize-button" aria-label="Minimize Gallery window"></button>
        <button class="fullscreen-button" aria-label="Maximize Gallery window"></button>
      </div>
      <span class="window-title">Gallery</span>
    </div>
    <div class="window-content gallery-app-container">
      <div id="gallery-content" class="gallery-grid">
        <!-- Media dynamically inserted here via galleryApp.js -->
      </div>
      
      <!-- Lightbox fully constrained to the window -->
      <div id="gallery-lightbox" class="gallery-lightbox-overlay" style="display: none;">
        <button id="lightbox-close" class="lightbox-btn lightbox-close" aria-label="Close Lightbox">&times;</button>
        <button id="lightbox-prev" class="lightbox-btn lightbox-arrow lightbox-prev" aria-label="Previous">&lsaquo;</button>
        <div class="lightbox-media-container" id="lightbox-media-container"></div>
        <button id="lightbox-next" class="lightbox-btn lightbox-arrow lightbox-next" aria-label="Next">&rsaquo;</button>
      </div>
    </div>
  </div>

  <!-- Preview window (for images/videos on desktop) -->
  <div id="preview-window" class="window" style="display:none; width:560px; height:420px;">
    <div class="window-header">
      <div class="window-controls">
        <button class="close-button" aria-label="Close Preview window"></button>
        <button class="minimize-button" aria-label="Minimize Preview window"></button>
        <button class="fullscreen-button" aria-label="Maximize Preview window"></button>
      </div>
      <span class="window-title">Preview</span>
    </div>
    <div class="window-content" id="preview-content" style="display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgba(0,0,0,0.4); padding: 10px;">
      <!-- Image/Video injected here -->
    </div>
  </div>

  <!-- Scripts (order matters) -->
  <!-- Content first: settings + catalog, then siteContent builds artist folders/windows
       before the desktop scripts below bind their events. -->
  <script src="assets/js/siteSettings.js"></script>
  <script src="assets/js/musicData.js"></script>
  <script src="assets/js/siteContent.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="assets/js/clockBattery.js"></script>
  <script src="assets/js/windowDragResize.js"></script>
  <script src="assets/js/windowControls.js?v=2"></script>
  <script src="assets/js/osDragDrop.js"></script>
  <script src="assets/js/trashBehavior.js"></script>
  <script src="assets/js/folderSelection.js"></script>
  <script src="assets/js/physics.js"></script>
  <script src="assets/js/dockBehavior.js"></script>
  <script src="assets/js/terminal.js"></script>

  <!-- Notifications (new) -->
  <script src="assets/js/notificationsData.js"></script>
  <script src="assets/js/notifications.js"></script>

  <!-- Galery App -->
  <script src="assets/js/galleryData.js"></script>
  <script src="assets/js/galleryApp.js"></script>

  <!-- Audio Player Apps -->
  <script type="module" src="assets/js/audioPlayer.js"></script>
</body>
</html>
